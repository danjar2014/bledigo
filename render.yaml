# Blueprint Render pour BlediGo
#
# Deux services : l API NestJS et le front Next.js. Ils se raccordent a la base
# PostgreSQL BlediGo_DB, creee a la main dans l espace de travail Render.
#
# La base n est volontairement PAS declaree ici : un blueprint peut referencer
# une ressource existante de l espace de travail, mais s il la declarait il
# tenterait d en creer une seconde. En contrepartie, BlediGo_DB doit exister
# avant la premiere synchronisation, sinon le blueprint echoue.
#
# Les URL publiques sont injectees automatiquement d un service a l autre, ce qui
# evite de coder en dur des adresses qui changent a chaque environnement.
#
# Mise en place : Render > New > Blueprint, puis pointer sur ce depot.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: bledigo-api
    runtime: node
    rootDir: bledigo-api
    plan: free
    healthCheckPath: /health
    # --include=dev est indispensable : NODE_ENV=production fait sauter les
    # devDependencies a npm ci, or nest, prisma et typescript en font partie.
    # Sans cela le build echoue faute d outils, pas faute de code.
    #
    # Le client Prisma est genere depuis le schema PostgreSQL, pas depuis
    # schema.prisma qui reste en SQLite pour le developpement local.
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema.postgres.prisma && npm run build
    # migrate deploy est idempotent : il n applique que les migrations manquantes.
    startCommand: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      # Base existante dans l espace de travail : le nom doit correspondre
      # exactement a celui affiche dans Render.
      - key: DATABASE_URL
        fromDatabase:
          name: BlediGo_DB
          property: connectionString
      # Secrets generes par Render, jamais commites
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Origine autorisee par CORS : l URL publique du front
      - key: FRONTEND_URL
        fromService:
          type: web
          name: bledigo-web
          property: host
      # Services externes : vides = mode simule, l API demarre sans eux
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: REDIS_URL
        sync: false

  # ---------------------------------------------------------------- Front
  - type: web
    name: bledigo-web
    runtime: node
    rootDir: bledigo-web
    plan: free
    # Meme raison que pour l API : sans --include=dev, ni TypeScript ni Tailwind
    # ne sont installes, et Next.js cesse alors de resoudre l alias @/ declare
    # dans tsconfig.json — le build casse sur des modules pourtant presents.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Next.js fige les variables NEXT_PUBLIC_ au build : elle doit etre
      # presente avant la compilation, pas seulement au demarrage.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bledigo-api
          property: host
