# Blueprint Render pour BlediGo
#
# Trois ressources : la base PostgreSQL, l API NestJS et le front Next.js.
#
# Les URL publiques sont ecrites en dur, volontairement : Render n expose que le
# nom d hote du reseau prive, jamais l adresse publique. Le detail est explique
# sur FRONTEND_URL et NEXT_PUBLIC_API_URL plus bas — les remplacer par
# fromService casse le CORS et le front.
#
# Mise en place : Render > New > Blueprint, puis pointer sur ce depot.

# La base BlediGo_DB n est PAS declaree ici : elle existe deja dans l espace de
# travail, et un blueprint qui la declarerait tenterait d en creer une seconde.
# Il la reference simplement par son nom, plus bas.
#
# Elle doit vivre dans la MEME REGION que les services, ici oregon : le reseau
# prive de Render ne franchit pas les frontieres de region. Une base a Francfort
# donne un P1001 au demarrage alors que l URL de connexion est pourtant juste.
# Cette region est figee a la creation.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: bledigo-api
    runtime: node
    rootDir: bledigo-api
    plan: free
    healthCheckPath: /health
    # --include=dev est indispensable : NODE_ENV=production fait sauter les
    # devDependencies a npm ci, or nest, prisma et typescript en font partie.
    # Sans cela le build echoue faute d outils, pas faute de code.
    #
    # Le client Prisma est genere depuis le schema PostgreSQL, pas depuis
    # schema.prisma qui reste en SQLite pour le developpement local.
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema.postgres.prisma && npm run build
    # migrate deploy est idempotent : il n applique que les migrations manquantes.
    #
    # Le semis suit, car le Shell Render n est pas disponible sur l offre
    # gratuite : c est le seul moyen de peupler la base. Il est lui aussi
    # idempotent (upsert sur email et slug, tous deux uniques), donc sans
    # danger a chaque reveil du service.
    #
    # On invoque le script directement plutot que `prisma db seed` : la CLI
    # chargerait schema.prisma, reste en sqlite, et refuserait une URL
    # PostgreSQL. Le `|| true` garantit qu un semis en echec n empeche jamais
    # l API de demarrer.
    #
    # Ce rejeu a chaque reveil est aussi le seul moyen d agir sur des comptes
    # deja en base, le Shell etant indisponible : c est par le semis que les
    # anciens comptes de demonstration sont fermes.
    startCommand: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma && (npx ts-node prisma/seed.ts || true) && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      # Phase d amorcage : paiement DIRECT entre voyageur et hote, aucun montant
      # ne transite par la plateforme. Le dispositif de paiement, validation,
      # refus et gel reste en place mais en sommeil — passer cette valeur a
      # "true" le rallume, sans redeveloppement.
      - key: PAIEMENT_EN_LIGNE
        value: "false"
      # ATTENTION - une variable `sync: false` ajoutee ici APRES la creation du
      # blueprint n apparaitra jamais dans le tableau de bord. Render ne demande
      # ces valeurs qu a la creation initiale et les ignore a chaque sync
      # ulterieur : relancer le sync ne sert a rien, il faut les saisir a la
      # main dans Environment. Ce qui suit documente donc l attendu, sans le
      # provisionner. Voir https://render.com/docs/blueprint-spec
      #
      # Comptes de demonstration. Le semis ne contient plus aucun mot de passe :
      # sans DEMO_PASSWORD, les comptes existent mais la connexion par mot de
      # passe leur est fermee. A saisir dans l interface Render, jamais ici.
      #
      # SEED_DEMO=false coupe entierement le jeu de demonstration et ferme les
      # trois comptes d origine : c est l interrupteur a basculer avant
      # l ouverture au public.
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      # Adresses des deux comptes d essai. Les laisser vides garde
      # owner@bledigo.com et traveler@bledigo.com.
      - key: DEMO_EMAIL_OWNER
        sync: false
      - key: DEMO_EMAIL_TRAVELER
        sync: false
      # Administrateur : il n existe QUE si ces deux valeurs sont renseignees.
      # Il n y a plus de compte admin par defaut — l ancien, admin@bledigo.com,
      # avait son mot de passe dans le depot. Changer ADMIN_PASSWORD puis
      # redeployer suffit a le faire tourner.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Identifiant client Google. Il sert a verifier que le jeton recu a bien
      # ete emis POUR BlediGo : sans ce controle, un jeton valide emis pour une
      # autre application serait accepte.
      #
      # En clair, et c est delibere : ce n est pas un secret, il est publie
      # dans le bundle JavaScript du front a chaque visite. Le laisser en
      # `sync: false` le rendait impossible a provisionner sur un blueprint
      # deja cree, et la connexion Google restait muette faute de valeur.
      # Le client SECRET, lui, n existe pas ici : Google Identity Services
      # fonctionne par jeton signe.
      #
      # Vide = connexion Google desactivee, l email reste disponible.
      - key: GOOGLE_CLIENT_ID
        value: 12342673780-3l6kojeqhniup2a6qt999ejsnf9v215j.apps.googleusercontent.com
      # La base n est plus hebergee par Render : elle vit chez Supabase, saisie
      # a la main dans Environment. `fromDatabase` pointait BlediGo_DB, une base
      # en offre gratuite que Render supprime au bout de trente jours — le champ
      # expiresAt portait le 09/09/2026, donnees comprises.
      #
      # `sync: false` sert ici a DESSAISIR le blueprint d une variable deja
      # provisionnee : sans cela, le prochain sync la ramenerait sur la base
      # Render mourante. La valeur saisie a la main, elle, survit au sync.
      #
      # Deux contraintes sur cette URL, apprises a la dure. Elle DOIT passer par
      # le pooler partage `...pooler.supabase.com:5432` : l hote direct
      # `db.<ref>.supabase.co` n a qu un enregistrement AAAA, injoignable depuis
      # Render qui ne sort qu en IPv4. Et le port 5432 (session), jamais 6543
      # (transaction) : Prisma a besoin d une connexion de session pour jouer
      # ses migrations au demarrage.
      #
      # Le projet Supabase est en eu-west-1 alors que ce service est en oregon.
      # C est assume le temps de la recette — voir CLAUDE.md, un aller-retour
      # transatlantique se paie sur CHAQUE requete Prisma.
      - key: DATABASE_URL
        sync: false
      # Secrets generes par Render, jamais commites
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Origine autorisee par CORS : l URL PUBLIQUE du front.
      #
      # Surtout pas fromService/host : Render n expose que le nom d hote du
      # reseau prive, soit "bledigo-web" tout court. Aucune propriete ne donne
      # l URL publique. Le navigateur presente une origine en
      # https://bledigo-web.onrender.com, que le CORS rejetterait.
      - key: FRONTEND_URL
        value: https://bledigo-web.onrender.com
      # Services externes : vides = mode simule, l API demarre sans eux
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: REDIS_URL
        sync: false

  # ---------------------------------------------------------------- Front
  - type: web
    name: bledigo-web
    runtime: node
    rootDir: bledigo-web
    plan: free
    # Meme raison que pour l API : sans --include=dev, ni TypeScript ni Tailwind
    # ne sont installes, et Next.js cesse alors de resoudre l alias @/ declare
    # dans tsconfig.json — le build casse sur des modules pourtant presents.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # URL PUBLIQUE de l API : ce code s execute dans le navigateur du
      # visiteur, qui n a evidemment pas acces au reseau prive de Render.
      # fromService/host renvoyait "bledigo-api", d ou un "Failed to fetch".
      #
      # Next.js fige les variables NEXT_PUBLIC_ au build : la modifier impose
      # de reconstruire le service, pas seulement de le redemarrer.
      - key: NEXT_PUBLIC_API_URL
        value: https://bledigo-api.onrender.com
      # Meme identifiant que cote API, et il doit le rester : l API refuse tout
      # jeton dont l audience ne correspond pas.
      #
      # Fige a la compilation comme toute variable NEXT_PUBLIC_ : le modifier
      # impose de RECONSTRUIRE le front, un redemarrage ne suffit pas. Le
      # symptome d une valeur absente au build est silencieux — GoogleButton
      # retourne null, aucun bouton n apparait, aucune erreur nulle part.
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 12342673780-3l6kojeqhniup2a6qt999ejsnf9v215j.apps.googleusercontent.com
